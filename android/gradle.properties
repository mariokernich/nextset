org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# Version of the phone and the watch app. Google Play needs a unique version
# code per upload, so the phone uses nextset.versionCode * 10 and the watch
# nextset.versionCode * 10 + 1. Raise nextset.versionCode for every release.
nextset.versionCode=1
nextset.versionName=1.0
