name: Android

# Builds and tests the Android project in android/ (phone app, Wear OS app and
# the shared core). Run it by hand with "Signed release bundles" to get the
# .aab files for Google Play; that needs the upload key in the repository
# secrets NEXTSET_KEYSTORE_BASE64, NEXTSET_KEYSTORE_PASSWORD, NEXTSET_KEY_ALIAS
# and NEXTSET_KEY_PASSWORD (see README).

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: Signed release bundles for Google Play
        type: boolean
        default: false

# One run per branch: a newer push or pull request update replaces the one in
# progress. Release builds have their own group, so a push doesn't cancel them.
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}${{ inputs.release && '-release' || '' }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug builds (phone, watch)
        run: ./gradlew :core:testDebugUnitTest :app:assembleDebug :wear:assembleDebug

      - name: Signed release bundles
        if: inputs.release
        env:
          NEXTSET_KEYSTORE_BASE64: ${{ secrets.NEXTSET_KEYSTORE_BASE64 }}
          NEXTSET_KEYSTORE_PASSWORD: ${{ secrets.NEXTSET_KEYSTORE_PASSWORD }}
          NEXTSET_KEY_ALIAS: ${{ secrets.NEXTSET_KEY_ALIAS }}
          NEXTSET_KEY_PASSWORD: ${{ secrets.NEXTSET_KEY_PASSWORD }}
        run: |
          if [ -z "$NEXTSET_KEYSTORE_BASE64" ] || [ -z "$NEXTSET_KEYSTORE_PASSWORD" ] || [ -z "$NEXTSET_KEY_ALIAS" ] || [ -z "$NEXTSET_KEY_PASSWORD" ]; then
            echo "::error::The upload key secrets are not set (see README)"
            exit 1
          fi
          printf '%s' "$NEXTSET_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export NEXTSET_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew :app:bundleRelease :wear:bundleRelease
          echo "Built NextSet for Google Play: phone and Wear OS bundles are attached to this run." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundles
        if: inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: google-play-bundles
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/wear/build/outputs/bundle/release/*.aab

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/*/build/reports/tests
          if-no-files-found: ignore
