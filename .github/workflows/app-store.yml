name: App Store

# Archives NextSet (iPhone app with the watch app and widget), uploads the build
# to App Store Connect and, if asked, submits it for App Review.
#
# Signs manually with an Apple Distribution certificate and one App Store
# provisioning profile per target, so the API key only needs to upload builds.
# Repository secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   App Store Connect API key (contents of
#                                           AuthKey_….p8), role Developer is enough
#                                           for uploads; submitting for review needs
#                                           App Manager or Admin
#   DISTRIBUTION_P12, DISTRIBUTION_P12_PASSWORD
#                                           Apple Distribution certificate with key,
#                                           base64-encoded .p12
#   PROFILE_APP, PROFILE_WATCH, PROFILE_WIDGETS
#                                           App Store profiles "NextSet App Store CI",
#                                           "NextSet Watch App Store CI" and "NextSet
#                                           Widgets App Store CI" (base64), all with
#                                           that certificate

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit for App Review once the build has processed
        type: boolean
        default: false

# One release at a time; a second run waits.
concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  upload:
    name: Archive & upload
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # Same choice as the iOS CI: the newest Xcode 27 on the image, otherwise its default.
      - name: Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          [ -n "$xcode" ] || xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: API key, certificate and profiles
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DISTRIBUTION_P12: ${{ secrets.DISTRIBUTION_P12 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          PROFILE_APP: ${{ secrets.PROFILE_APP }}
          PROFILE_WATCH: ${{ secrets.PROFILE_WATCH }}
          PROFILE_WIDGETS: ${{ secrets.PROFILE_WIDGETS }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DISTRIBUTION_P12 DISTRIBUTION_P12_PASSWORD PROFILE_APP PROFILE_WATCH PROFILE_WIDGETS; do
            if [ -z "$(printenv $name)" ]; then echo "::error::The secret $name is not set"; exit 1; fi
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/distribution.p12"

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            printf '%s' "$PROFILE_APP" | base64 --decode > "$dir/nextset-app.mobileprovision"
            printf '%s' "$PROFILE_WATCH" | base64 --decode > "$dir/nextset-watch.mobileprovision"
            printf '%s' "$PROFILE_WIDGETS" | base64 --decode > "$dir/nextset-widgets.mobileprovision"
          done

      # The build number continues after the one in the project (builds
      # uploaded from Xcode) and grows with every run of this workflow.
      - name: Version
        id: version
        run: |
          version=$(grep -m 1 -o 'MARKETING_VERSION = [^;]*' NextSet.xcodeproj/project.pbxproj | cut -d ' ' -f 3)
          project_build=$(grep -m 1 -o 'CURRENT_PROJECT_VERSION = [0-9]*' NextSet.xcodeproj/project.pbxproj | cut -d ' ' -f 3)
          build=$((project_build + GITHUB_RUN_NUMBER))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "NextSet $version ($build)"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project NextSet.xcodeproj \
            -scheme NextSet \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/NextSet.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            "NEXTSET_PROFILE_APP=NextSet App Store CI" \
            "NEXTSET_PROFILE_WATCH=NextSet Watch App Store CI" \
            "NEXTSET_PROFILE_WIDGETS=NextSet Widgets App Store CI" \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            2>&1 | tee archive.log | grep -E "(error|warning):|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NextSet.xcarchive" \
            -exportOptionsPlist Config/ExportOptions-CI.plist \
            -exportPath "$RUNNER_TEMP/export" \
            2>&1 | tee upload.log | grep -E "(error|warning):|\*\* EXPORT" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" upload.log
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/export/NextSet.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee -a upload.log
          echo "Uploaded NextSet ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }}) to App Store Connect" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-logs
          path: "ios/*.log"
          if-no-files-found: ignore

  # Waiting for App Store Connect to process the build takes a while, so this
  # runs on Linux instead of the macOS runner.
  submit:
    name: Submit for review
    needs: upload
    if: inputs.submit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Submit NextSet ${{ needs.upload.outputs.version }} (${{ needs.upload.outputs.build }})
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install --quiet "pyjwt[crypto]" requests
          python ios/scripts/app_store_submit.py --version "${{ needs.upload.outputs.version }}" --build "${{ needs.upload.outputs.build }}"
