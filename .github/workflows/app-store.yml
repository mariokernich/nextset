name: App Store

# Archives NextSet (iPhone app with the watch app and widget), uploads the build
# to App Store Connect and, if asked, submits it for App Review.
#
# Needs an App Store Connect API key in the repository secrets ASC_KEY_ID,
# ASC_ISSUER_ID and ASC_KEY_P8 (the contents of the AuthKey_….p8 file). The key
# needs the Admin role, so Xcode may create signing certificates and profiles.
# Each run can leave an "Apple Development … (Created via API)" certificate
# behind; old ones can be revoked in the developer account.

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit for App Review once the build has processed
        type: boolean
        default: false

# One release at a time; a second run waits.
concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  upload:
    name: Archive & upload
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # Same choice as the iOS CI: the newest Xcode 27 on the image, otherwise its default.
      - name: Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          [ -n "$xcode" ] || xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::The secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 are not set"
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Build 1 was uploaded from Xcode, so the builds from here start at 2.
      - name: Version
        id: version
        run: |
          version=$(grep -m 1 -o 'MARKETING_VERSION = [^;]*' NextSet.xcodeproj/project.pbxproj | cut -d ' ' -f 3)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_OUTPUT"
          echo "NextSet $version ($((GITHUB_RUN_NUMBER + 1)))"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project NextSet.xcodeproj \
            -scheme NextSet \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/NextSet.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            2>&1 | tee archive.log | grep -E "(error|warning):|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NextSet.xcarchive" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee upload.log | grep -E "(error|warning):|\*\* EXPORT|[Uu]pload" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" upload.log
          echo "Uploaded NextSet ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }}) to App Store Connect" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-logs
          path: "ios/*.log"
          if-no-files-found: ignore

  # Waiting for App Store Connect to process the build takes a while, so this
  # runs on Linux instead of the macOS runner.
  submit:
    name: Submit for review
    needs: upload
    if: inputs.submit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Submit NextSet ${{ needs.upload.outputs.version }} (${{ needs.upload.outputs.build }})
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install --quiet "pyjwt[crypto]" requests
          python ios/scripts/app_store_submit.py --version "${{ needs.upload.outputs.version }}" --build "${{ needs.upload.outputs.build }}"
