name: Website

# Publishes website/ (support page and privacy policy) to apps.kernich.de/nextset.
# Needs the repository secrets FTP_USERNAME and FTP_PASSWORD of an FTP account
# whose home is the document root of apps.kernich.de. If the account starts
# elsewhere, set the repository variable FTP_SERVER_DIR (e.g. /apps.kernich.de/nextset/).

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

# One deployment at a time; a newer run waits for the one in progress.
concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to apps.kernich.de/nextset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: web04.dataforest.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./website/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/nextset/' }}
          dangerous-clean-slate: false
          log-level: standard
